<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ご予約フォーム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="reservation.css" />
  <script src="https://hcaptcha.com/1/api.js" async defer></script>
  <script type="module" src="./reservation-app.js?v=3"></script>
  <style>body{font-family:'Noto Sans JP',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}</style>
</head>
<body>
  <header class="container header">
    <h1>ご予約フォーム</h1>
  </header>

  <main class="container grid">
    <!-- カレンダー -->
    <section class="card wide">
      <div class="monthbar">
        <button id="prevMonth" class="btn">前の月</button>
        <div id="monthLabel" class="month"></div>
        <button id="nextMonth" class="btn">次の月</button>
      </div>
      <div class="legend">
        <span><b>○</b> 空席</span>
        <span><b>△</b> 残り数席</span>
        <span><b>×</b> 満席</span>
        <span><b>－</b> 予約不可</span>
      </div>
      <div id="calendar" class="calendar"></div>
    </section>

    <!-- 予約内容 -->
    <section class="card">
      <h2>予約内容</h2>
      <form id="bookingForm" autocomplete="on">
        
        <div class="field">
          <div>日付と時間帯</div>
          <div id="pickedInfo" class="hint">カレンダーから日付を選択してください。</div>
          <div id="slotPicker" class="slots"></div>
          </div>

        <div class="field">
          <label>お名前 <span class="req">*</span></label>
          <div class="name-row">
            <div class="name-col"><span class="name-label">姓</span><input type="text" id="nameSei" required class="full-input" placeholder="例：山田"></div>
            <div class="name-col"><span class="name-label">名</span><input type="text" id="nameMei" required class="full-input" placeholder="例：花子"></div>
          </div>
        </div>

        <div class="field">
          <label>フリガナ <span class="req">*</span></label>
          <div class="name-row">
            <div class="name-col"><span class="name-label">姓</span><input type="text" id="kanaSei" required class="full-input" placeholder="例：ヤマダ"></div>
            <div class="name-col"><span class="name-label">名</span><input type="text" id="kanaMei" required class="full-input" placeholder="例：ハナコ"></div>
          </div>
        </div>

        <div class="field"><label>メールアドレス <span class="req">*</span></label><input type="email" id="email" required class="full-input"></div>
        <div class="field"><label>メールアドレス（確認用） <span class="req">*</span></label><input type="email" id="email2" required class="full-input"></div>
        <div class="field"><label>携帯番号 <span class="req">*</span></label><input type="tel" id="phone" required class="full-input"></div>

        <div class="field"><label>年代 <span class="req">*</span></label>
          <select id="age" required><option value="" disabled selected>年代を選択してください</option></select>
        </div>

        <div class="field">
          <label>住所（任意）</label>
          <div class="address-row"><span>〒</span><input type="text" id="zip" class="full-input zip-input" placeholder="1234567" maxlength="8"><button type="button" id="btnZip" class="addr-btn">住所検索</button></div>
          <div class="address-row"><span>都道府県</span>
            <select id="prefecture" class="full-input" style="max-width:150px;">
              <option value="">選択</option>
              <option value="北海道">北海道</option><option value="青森県">青森県</option><option value="岩手県">岩手県</option><option value="宮城県">宮城県</option><option value="秋田県">秋田県</option><option value="山形県">山形県</option><option value="福島県">福島県</option>
              <option value="茨城県">茨城県</option><option value="栃木県">栃木県</option><option value="群馬県">群馬県</option><option value="埼玉県">埼玉県</option><option value="千葉県">千葉県</option><option value="東京都">東京都</option><option value="神奈川県">神奈川県</option>
              <option value="新潟県">新潟県</option><option value="富山県">富山県</option><option value="石川県">石川県</option><option value="福井県">福井県</option><option value="山梨県">山梨県</option><option value="長野県">長野県</option><option value="岐阜県">岐阜県</option><option value="静岡県">静岡県</option><option value="愛知県">愛知県</option>
              <option value="三重県">三重県</option><option value="滋賀県">滋賀県</option><option value="京都府">京都府</option><option value="大阪府">大阪府</option><option value="兵庫県">兵庫県</option><option value="奈良県">奈良県</option><option value="和歌山県">和歌山県</option>
              <option value="鳥取県">鳥取県</option><option value="島根県">島根県</option><option value="岡山県">岡山県</option><option value="広島県">広島県</option><option value="山口県">山口県</option>
              <option value="徳島県">徳島県</option><option value="香川県">香川県</option><option value="愛媛県">愛媛県</option><option value="高知県">高知県</option>
              <option value="福岡県">福岡県</option><option value="佐賀県">佐賀県</option><option value="長崎県">長崎県</option><option value="熊本県">熊本県</option><option value="大分県">大分県</option><option value="宮崎県">宮崎県</option><option value="鹿児島県">鹿児島県</option><option value="沖縄県">沖縄県</option>
            </select>
          </div>
          <div style="margin-bottom:8px;"><label style="font-size:13px; color:#64748b;">市区町村・番地</label><input type="text" id="address1" class="full-input" placeholder="例：名古屋市中区〇〇 1-2-3"></div>
          <div><label style="font-size:13px; color:#64748b;">建物名・部屋番号</label><input type="text" id="address2" class="full-input" placeholder="例：メゾン森 101号室"></div>
        </div>

        <div class="field"><label for="session">ご希望のセッション <span class="req">*</span></label><select id="session" name="session" required></select></div>

        <div class="field"><label>対面 / オンライン <span class="req">*</span></label>
          <div class="radio-group"><label class="radio"><input type="radio" name="visit" value="inperson" required> 対面</label><label class="radio"><input type="radio" name="visit" value="online"> オンライン</label></div>
        </div>
        <div id="onlineToolRow" class="field inline hidden"><span>オンラインのツールを選択してください</span>
          <div class="radio-group"><label class="radio"><input type="radio" name="tool" value="Zoom"> Zoom</label><label class="radio"><input type="radio" name="tool" value="LINE"> LINE</label></div>
        </div>

        <div class="field"><label>お支払い方法 <span class="req">*</span></label>
          <div class="radio-group"><label class="radio"><input type="radio" name="pay" value="当日: 現金" required> 当日: 現金</label><label class="radio"><input type="radio" name="pay" value="前日まで: 銀行振込"> 前日まで: 銀行振込</label><label class="radio"><input type="radio" name="pay" value="クレジットカード"> クレジットカード</label></div>
        </div>

        <div class="field"><label>森 麻里奈の個人セッションは？ <span class="req">*</span></label>
          <div class="radio-group-vertical">
            <label class="radio"><input type="radio" name="past" value="初めて" required> 初めて</label>
            <label class="radio"><input type="radio" name="past" value="ヒプノセラピーのみ受けたことがある"> ヒプノセラピーのみ受けたことがある</label>
            <label class="radio"><input type="radio" name="past" value="カウンセリングのみ受けたことがある"> カウンセリングのみ受けたことがある</label>
            <label class="radio"><input type="radio" name="past" value="コーチングのみ受けたことがある"> コーチングのみ受けたことがある</label>
            <label class="radio"><input type="radio" name="past" value="カウンセリングもヒプノセラピーも受けたことがある"> カウンセリングもヒプノセラピーも受けたことがある</label>
            <label class="radio"><input type="radio" name="past" value="コーチングもヒプノセラピーも受けたことがある"> コーチングもヒプノセラピーも受けたことがある</label>
          </div>
          <div class="hint" style="color:#e11d48; margin-top:8px;">※グループワーク等は含みません。</div>
        </div>

        <div class="field"><label for="howKnown">当サイトを知ったきっかけ <span class="req">*</span></label>
          <select id="howKnown" name="howKnown" required>
            <option value="">選択してください</option>
            <option value="検索していて">検索していて</option>
            <option value="他のホームページ(リンク)から">他のホームページ(リンク)から</option>
            <option value="スマホサイトから">スマホサイトから</option>
            <option value="ご紹介">ご紹介</option>
            <option value="ブログ">ブログ</option>
            <option value="Facebook">Facebook</option>
            <option value="Twitter">Twitter</option>
            <option value="LINE">LINE</option>
            <option value="Instagram">Instagram</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="field"><label for="message">メッセージ（任意）</label><textarea id="message" name="message" rows="5" placeholder="ご要望などがあればご記入ください"></textarea></div>

        <button class="btn primary" type="submit">送信する</button>
        <div class="req-note">※ <span class="req">*</span> は必須項目です</div>
      </form>
    </section>
  </main>
</body>
</html>
