<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>予約管理</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./reservation.css?v=2">
  <link rel="stylesheet" href="./reservation-admin.css?v=9">
</head>
<body>
  <div class="wrap">
    <h1>予約管理</h1>

    <div class="tools card">
      <div class="tool-row">
        
        <div class="group">
          <button id="btnSignIn" class="btn btn-outline">Googleで管理者ログイン</button>
        </div>

        <div class="group">
          <button id="toggleBulk" class="btn-toggle" aria-pressed="false">
            <span class="dot"></span><span>一括選択</span>
          </button>
          <span id="bulkCount" class="muted">選択 0 日</span>
          <button id="clearSel" class="btn btn-ghost">クリア</button>
        </div>
        
        <div class="group">
          <button id="blockSel" class="btn btn-primary">選択を予約不可にする</button>
          <button id="unblockSel" class="btn btn-danger">解除</button>
        </div>

        <div class="group" style="border-left:1px solid #e2e8f0; padding-left:12px; margin-left:4px;">
          <div style="font-size:12px; font-weight:bold; width:100%; color:#64748b; margin-bottom:4px;">曜日を一括設定</div>
          
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <label><input type="checkbox" name="wd" value="0"> 日</label>
            <label><input type="checkbox" name="wd" value="1"> 月</label>
            <label><input type="checkbox" name="wd" value="2"> 火</label>
            <label><input type="checkbox" name="wd" value="3"> 水</label>
            <label><input type="checkbox" name="wd" value="4"> 木</label>
            <label><input type="checkbox" name="wd" value="5"> 金</label>
            <label><input type="checkbox" name="wd" value="6"> 土</label>
          </div>
          
          <div style="margin-top:6px; display:flex; gap:6px;">
            <button id="blockWeekday" class="btn btn-primary" style="font-size:12px; padding:6px 10px;">予約不可にする</button>
            <button id="unblockWeekday" class="btn btn-danger" style="font-size:12px; padding:6px 10px;">解除</button>
          </div>
        </div>

      </div>
    </div>

    <div id="bulkHint" class="hint" hidden>一括選択中。カレンダーの日をクリックして追加/解除できます。</div>

    <div class="card">
      <div class="cal-header">
        <div class="row">
          <button id="prevMonth" aria-label="前の月">←</button>
          <strong id="monthLabel"></strong>
          <button id="nextMonth" aria-label="次の月">→</button>
        </div>
        <div class="muted">◯ 空席 / △ 残り数席 / × 満席 / － 予約不可</div>
      </div>
      <div id="calendar" class="calendar"></div>
    </div>

    <div id="dayDetail" class="card" style="display:none">
      <div class="row" style="justify-content:space-between">
        <h2 id="dayTitle" style="margin:0"></h2>
        <div class="row">
          <button id="toggleBlockBtn" class="btn">この日を予約不可にする</button>
        </div>
      </div>
      <div id="countInfo" class="muted" style="margin-top:6px"></div>
      <div id="reservationList" class="list"></div>
    </div>

    <p class="muted">※ このページは管理用です</p>
  </div>

  <script type="module" src="./reservation-admin.js?v=6"></script>
</body>
</html>
